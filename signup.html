<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create your account | VOLTWAY</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth">
      <section class="authbox">
        <div class="auth-top">
          <button type="button" class="ctrl" data-theme>Dark</button>
          <button type="button" class="ctrl" data-dir>LTR</button>
        </div>
        <a class="brand" href="index.html" aria-label="VOLTWAY Home">
          <img class="brand-logo" src="assets/logo.png" alt="VOLTWAY" />
        </a>
        <h1>Create your account</h1>
        <p>Access your vehicle and test-drive information.</p>
        <form
          data-demo
          data-msg="Demo authentication form validated. Connect a secure identity provider."
        >
          <div class="field">
            <label for="signup-name">Full name</label>
            <input
              id="signup-name"
              name="name"
              placeholder="Your full name"
              required
            />
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input
              id="signup-email"
              name="email"
              type="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input
              id="signup-password"
              name="password"
              type="password"
              placeholder="Minimum 8 characters"
              required
              minlength="8"
            />
          </div>
          <button
            type="submit"
            class="btn"
            style="width: 100%; margin-top: 8px"
          >
            Create account
          </button>
        </form>
        <p class="auth-alt"><a href="login.html">Sign in</a></p>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
