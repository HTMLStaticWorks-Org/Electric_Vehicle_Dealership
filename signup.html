<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create your account | VOLTWAY</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth">
      <section class="authbox">
        <div class="auth-top">
          <button type="button" class="ctrl" data-theme>Dark</button>
          <button type="button" class="ctrl" data-dir>LTR</button>
        </div>
        <a class="brand" href="index.html" aria-label="VOLTWAY Home">
          <img class="brand-logo" src="assets/logo.png" alt="VOLTWAY" />
        </a>
        <h1>Create your account</h1>
        <p>Access your vehicle and test-drive information.</p>

        <form
          data-demo
          data-msg="Demo registration validated. Connect a secure identity provider."
        >
          <div class="field">
            <label for="signup-name">Full name</label>
            <input
              id="signup-name"
              name="name"
              placeholder="Your full name"
              required
            />
          </div>

          <div class="field">
            <label for="signup-email">Email</label>
            <input
              id="signup-email"
              name="email"
              type="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="field">
            <label for="signup-password">Password</label>
            <div class="pw-wrap">
              <input
                id="signup-password"
                name="password"
                type="password"
                placeholder="Minimum 8 characters"
                required
                minlength="8"
              />
              <button
                type="button"
                class="pw-toggle"
                data-pw-toggle="signup-password"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="signup-confirm">Confirm password</label>
            <div class="pw-wrap">
              <input
                id="signup-confirm"
                name="confirmPassword"
                type="password"
                placeholder="Re-enter your password"
                required
                minlength="8"
                data-match="signup-password"
              />
              <button
                type="button"
                class="pw-toggle"
                data-pw-toggle="signup-confirm"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>

          <label class="auth-check">
            <input type="checkbox" name="terms" required />
            <span>
              I agree to the
              <a
                href="#terms"
                data-demo="Connect your Terms &amp; Conditions document."
              >
                Terms &amp; Conditions
              </a>
              and
              <a
                href="#privacy"
                data-demo="Connect your Privacy Policy document."
              >
                Privacy Policy
              </a>.
            </span>
          </label>

          <button type="submit" class="btn" style="width: 100%">
            Create account
          </button>
        </form>

        <div class="auth-or">or sign up with</div>
        <div class="auth-social">
          <button
            type="button"
            class="social-btn"
            data-demo="Google sign-up requires a connected OAuth provider."
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.54 5.54 0 0 1-2.4 3.63v3.02h3.88c2.27-2.09 3.54-5.17 3.54-8.89z" />
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.88-3.02c-1.07.72-2.44 1.15-4.05 1.15-3.12 0-5.76-2.11-6.7-4.96H1.29v3.11A12 12 0 0 0 12 24z" />
              <path fill="#FBBC05" d="M5.3 14.26A7.2 7.2 0 0 1 4.92 12c0-.78.14-1.54.38-2.26V6.63H1.29A12 12 0 0 0 0 12c0 1.94.46 3.77 1.29 5.37l4.01-3.11z" />
              <path fill="#EA4335" d="M12 4.78c1.76 0 3.34.61 4.58 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.29 6.63l4.01 3.11c.94-2.85 3.58-4.96 6.7-4.96z" />
            </svg>
            <span>Google</span>
          </button>
          <button
            type="button"
            class="social-btn"
            data-demo="Apple sign-up requires a connected identity provider."
          >
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <p class="auth-alt"><a href="login.html">Sign in</a></p>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
